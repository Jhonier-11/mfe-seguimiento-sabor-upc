<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>mfe-seguimiento (modo independiente)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..700&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="http://localhost:8085/tokens.css">
  <style>
    body { font-family: var(--upc-fuente-base, 'Hanken Grotesk', system-ui, sans-serif); margin: 24px; background: var(--upc-color-fondo, #f4eedd); color: var(--upc-color-texto, #1c2b21); }
    .banda { background: #f9efc9; border: 1px dashed #c9a227; border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="banda">
    Modo independiente: simulamos el evento del carrito con este botón (los estados avanzan cada 2 s).
    <button onclick="simular()">Simular pedido confirmado</button>
  </div>
  <div id="raiz-local"></div>
  <h3>Eventos publicados</h3>
  <ul id="eventos"></ul>

  <script src="seguimiento.js" data-intervalo-ms="2000"></script>
  <script>
    let n = 0;
    function simular() {
      n++;
      window.dispatchEvent(new CustomEvent('pedido:confirmado', { detail: {
        version: 1, id: n, total: 12500, fecha: new Date().toISOString(),
        items: [{ id: 101, nombre: 'Plato de prueba A', precio: 10000, cantidad: 1 },
                { id: 102, nombre: 'Plato de prueba B', precio: 2500, cantidad: 1 }]
      } }));
    }
    window.addEventListener('pedido:estado', function (e) {
      const li = document.createElement('li');
      li.textContent = 'pedido:estado → ' + JSON.stringify(e.detail);
      document.getElementById('eventos').appendChild(li);
    });
    window.renderSeguimiento('raiz-local');
  </script>
</body>
</html>
